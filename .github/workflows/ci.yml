name: JITIS fork CI

on:
  pull_request:
  push:
    branches:
      - jitis-v3
    tags:
      - "3.0.0+jitis.*"

concurrency:
  group: wiki-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: wiki_${{ github.run_id }}_quality
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run quality checks
        run: docker compose -f ci/compose.yaml run --build --rm quality

      - name: Remove disposable resources
        if: always()
        run: docker compose -f ci/compose.yaml down --volumes --remove-orphans

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: wiki_${{ github.run_id }}_integration
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run disposable Frappe integration tests
        run: docker compose -f ci/compose.yaml run --build --rm integration

      - name: Remove disposable resources
        if: always()
        run: docker compose -f ci/compose.yaml down --volumes --remove-orphans
