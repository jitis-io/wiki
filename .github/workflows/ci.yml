name: JITIS fork CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - jitis-v3
    tags:
      # `+` is a glob quantifier in Actions filters; escape it so annotated
      # SemVer build-metadata tags actually start this release gate.
      - '3.0.0\+jitis.*'

concurrency:
  group: wiki-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: wiki_${{ github.run_id }}_quality
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run quality checks
        run: docker compose -f ci/compose.yaml run --build --rm quality

      - name: Remove disposable resources
        if: always()
        run: docker compose -f ci/compose.yaml down --volumes --remove-orphans

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE_PROJECT_NAME: wiki_${{ github.run_id }}_integration
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run disposable Frappe integration tests
        run: docker compose -f ci/compose.yaml run --build --rm integration

      - name: Remove disposable resources
        if: always()
        run: docker compose -f ci/compose.yaml down --volumes --remove-orphans
